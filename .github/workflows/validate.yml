name: Hayes Verify Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install ruff pytest jsonschema

      - name: Validate frozen EMS contract bundle
        run: python scripts/validate_contract_bundle.py --root .

      - name: Ruff
        run: python -m ruff check src tests scripts/validate_contract_bundle.py

      - name: Pytest
        run: python -m pytest -q
