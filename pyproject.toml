[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hayes-verify"
version = "0.1.0"
description = "Contract-driven evidence collection and control evaluation engine for EMS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
hayes-verify = "hayes_verify.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

addopts = "--basetemp=.pytest-temp"
[tool.ruff]
line-length = 100
